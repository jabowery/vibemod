[pytest]
# Pytest configuration for modify_code tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    phase1: Phase 1 tests (command block extraction)
    phase2: Phase 2 tests (canonicalization)
    phase3: Phase 3 tests (execution)
    integration: Integration tests (end-to-end)
    slow: Marks tests as slow running

# Test paths
testpaths = .

# Minimum version
minversion = 6.0
